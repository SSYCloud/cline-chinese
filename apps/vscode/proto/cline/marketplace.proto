syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service MarketplaceService {
  rpc getMarketplaceCatalog(EmptyRequest) returns (MarketplaceCatalog);
  rpc listMarketplaceLocalInstalledEntries(EmptyRequest) returns (MarketplaceLocalInstalledEntries);
  rpc listMarketplaceInstalledEntries(MarketplaceEntriesRequest) returns (MarketplaceInstalledEntries);
  rpc installMarketplaceEntry(MarketplaceEntryRequest) returns (MarketplaceInstallResult);
  rpc uninstallMarketplaceEntry(MarketplaceEntryRequest) returns (MarketplaceInstallResult);
  rpc toggleMarketplaceLocalInstalledEntry(ToggleMarketplaceLocalInstalledEntryRequest) returns (MarketplaceLocalInstalledEntries);
  rpc uninstallMarketplaceLocalInstalledEntry(MarketplaceLocalInstalledEntryRequest) returns (MarketplaceInstallResult);
  rpc getMarketplaceEntryDetail(MarketplaceEntryDetailRequest) returns (MarketplaceEntryDetail);
  rpc executeMarketplaceEntry(MarketplaceEntryExecuteRequest) returns (MarketplaceEntryExecuteResult);
  rpc quoteMarketplaceEntry(MarketplaceEntryQuoteRequest) returns (MarketplaceEntryQuoteResult);
  rpc getMarketplaceRunResultArtifacts(MarketplaceRunResultArtifactsRequest) returns (MarketplaceRunResultArtifacts);
  rpc saveMarketplaceRunResult(MarketplaceSaveRunResultRequest) returns (Empty);
}

message MarketplaceTag {
  string label = 1;
  optional string color = 2;
}

message MarketplaceCounts {
  optional int32 tools = 1;
  optional int32 prompts = 2;
  optional int32 resources = 3;
}

message MarketplaceEnvVar {
  string name = 1;
  bool required = 2;
  optional string description = 3;
  optional string url = 4;
}

message MarketplaceInstall {
  repeated string args = 1;
  repeated MarketplaceEnvVar env = 2;
  optional string command = 3;
  optional string notes = 4;
}

message MarketplaceEntry {
  string id = 1;
  string type = 2;
  string name = 3;
  optional string tagline = 4;
  optional string description = 5;
  repeated string tags = 6;
  repeated MarketplaceTag tag_objects = 7;
  optional string author = 8;
  optional string source_url = 9;
  optional string homepage_url = 10;
  optional MarketplaceCounts counts = 11;
  optional MarketplaceInstall install = 12;
  optional string fee = 13;
}

message MarketplaceCatalog {
  repeated MarketplaceEntry entries = 1;
}

message MarketplaceEntriesRequest {
  repeated MarketplaceEntry entries = 1;
}

message MarketplaceInstalledEntries {
  repeated string installed_keys = 1;
}

message MarketplaceLocalInstalledEntry {
  string id = 1;
  string type = 2;
  string name = 3;
  optional string description = 4;
  optional string path = 5;
  optional string source = 6;
  bool enabled = 7;
}

message MarketplaceLocalInstalledEntries {
  repeated MarketplaceLocalInstalledEntry entries = 1;
}

message ToggleMarketplaceLocalInstalledEntryRequest {
  MarketplaceLocalInstalledEntry entry = 1;
  bool enabled = 2;
}

message MarketplaceLocalInstalledEntryRequest {
  MarketplaceLocalInstalledEntry entry = 1;
}

message MarketplaceEntryRequest {
  MarketplaceEntry entry = 1;
}

message MarketplaceInstallResult {
  string id = 1;
  string type = 2;
  string status = 3;
  string message = 4;
  optional string output = 5;
}

message MarketplaceEntryDetailRequest {
  string id = 1;
}

message MarketplaceEntryDetail {
  string id = 1;
  optional string name = 2;
  optional string input_schema_snapshot = 3;
}

message MarketplaceEntryExecuteInputRow {
  map<string, string> fields = 1;
}

message MarketplaceEntryExecuteRequest {
  string id = 1;
  repeated MarketplaceEntryExecuteInputRow input_rows = 2;
  bool confirm = 3;
  string client_request_id = 4;
}

message MarketplaceEntryExecuteResult {
  string status = 1;
  string message = 2;
  string output = 3;
  string run_id = 4;
  string run_transaction_id = 5;
  string transaction_status = 6;
  string skill_name = 7;
  string currency = 8;
  string final_buyer_payable = 9;
  string listing_id = 10;
  string listing_version_id = 11;
}

message MarketplaceEntryQuoteRequest {
  string id = 1;
  repeated MarketplaceEntryExecuteInputRow input_rows = 2;
  optional string listing_version_id = 3;
}

message MarketplaceEntryQuoteResult {
  string status = 1;
  string message = 2;
  string output = 3;
  string currency = 4;
  string estimated_buyer_payable = 5;
  string estimated_execution_cost = 6;
  string task_fixed_fee = 7;
  int64 task_count = 8;
  string quote_id = 9;
  string listing_version_id = 10;
}

message MarketplaceRunResultArtifactsRequest {
  string run_id = 1;
}

message MarketplaceRunResultArtifacts {
  string status = 1;
  string message = 2;
  string output = 3;
  bool done = 4;
  int64 total_count = 5;
}

message MarketplaceSaveRunResultRequest {
  string title = 1;
  string content = 2;
}
